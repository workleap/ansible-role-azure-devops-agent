---
- name: Read platform-specific variables
  ansible.builtin.include_vars: "{{ varfile }}"
  with_first_found:
    - files:
        - "{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version }}.yml"
        - "{{ ansible_facts.distribution }}.yml"
        - "{{ ansible_facts.os_family }}.yml"
        - "{{ ansible_facts.system }}.yml"
      skip: true
  loop_control:
    loop_var: varfile

# - ansible.builtin.debug:
#     msg:
#     - "Dependency lookup variables are :"
#     - "ansible_facts.distribution: {{ ansible_facts.distribution }}"
#     - "ansible_facts.distribution_major_version: {{ ansible_facts.distribution_major_version }}"
#     - "ansible_facts.os_family: {{ ansible_facts.os_family }}"
#     - "ansible_facts.system: {{ ansible_facts.system }}"

- name: Read platform-specific package list variables
  ansible.builtin.include_vars: "{{ varfile }}"
  with_first_found:
    - files:
        - "dependencies-{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version }}.yml"
        - "dependencies-{{ ansible_facts.distribution }}.yml"
        - "dependencies-{{ ansible_facts.os_family }}-{{ ansible_facts.distribution_major_version }}.yml"
        - "dependencies-{{ ansible_facts.os_family }}.yml"
        - "dependencies-{{ ansible_facts.system }}.yml"
      skip: true
  loop_control:
    loop_var: varfile

- name: Read platform specific tasks
  ansible.builtin.include_tasks: "{{ taskfile }}"
  with_first_found:
    - "{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version }}.yml"
    - "{{ ansible_facts.distribution }}.yml"
    - "{{ ansible_facts.os_family }}.yml"
    - "{{ ansible_facts.system }}.yml"
  loop_control:
    loop_var: taskfile
